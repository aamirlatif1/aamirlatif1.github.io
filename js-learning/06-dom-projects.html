<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dom projects</title>
</head>
<body>
    <p>YouTube Subscribe Button</p>
    <button onclick="
    Subscribe();
    " class="js-subscribe-button">
    Subscribe</button>

    <p>Amazon shipping calculater</p>
    <input placeholder="cost of order" class="js-cost-input">
    <button onclick="CalculaterTotal();
    ">calculater</button>
    <script>
        function CalculaterTotal() {
           console.log( document.querySelector('.js-cost-input'));

        }

        function Subscribe() {
            const buttonElement = document.querySelector
            ('.js-subscribe-button');
            

            if (buttonElement.innerText === 'Subscribe') {
                  buttonElement.innerHTML = 'Subscribed';
            } else {
                buttonElement.innerHTML = 'Subscribe';
            }
        }
    </script>
</body>
</html>
