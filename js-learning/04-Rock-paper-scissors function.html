                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Rock Paper Scissors</title>
                    <style>
                        body {
                            background-color: black;
                            color: white;
                            
                            font-family: Arial, Helvetica, sans-serif;
                            
                        }

                        .move-icon {
                            height: 30px;

                        }

                        .move-button{
                            background-color: transparent;
                            border: 3px solid white;
                            width: 120px;
                            height: 120px;
                            border-radius: 60px;
                            margin-right: 15px;
                            cursor: pointer;
                        }

                        .result{
                            font-size: 25px;
                            font-weight: bold;
                            margin-top: 50px;

                        }
                        .score {
                            margin-top: 60px;

                        }

                        .show-score-button {
                            background-color: white;
                            border: none;
                            font-size: 15px;
                            padding: 8px 15px;
                            cursor: pointer;
                        }
                        .reset-score-button {
                            background-color: white;
                            border: none;
                            font-size: 15px;
                            padding: 8px 15px;
                            cursor: pointer;

                        }
                    </style>
                </head>
                <body>
                    
                    <p>Rock Paper Scissors</p>
                        <button onclick="
                            playGame('Rock');
                        " class="move-button"><img src="image/rock-emoji.png" class="move-icon"></button>
                        <button onclick="
                            playGame('Paper');
                        " class="move-button"><img src="image/paper-emoji.png" class="move-icon"></button>
                        <button onclick="
                            playGame('Scissors');
                        " class="move-button"><img src="image/scissors-emoji.png" class="move-icon"></button>
                        <p class="js-result result "></p>
                        <p class="js-moves">
                            
                        </p>
                        <p class="js-score score"></p>

                        <button onclick="
                            alert(`score - Win: ${score.Win}, Lose: ${score.Lose}, Tie: ${score.Tie}`);
                        " class="show-score-button">Show Score</button>
                        <button onclick="
                            score.Win = 0;
                            score.Lose = 0;
                            score.Tie = 0;
                            localStorage.removeItem('score');
                            UpdateScoreElement();
                        " class="reset-score-button">Reset Score</button>
                        
                <script>
                    let score = JSON.parse(localStorage.getItem("score")) || {
                        Win: 0,
                        Lose: 0,
                        Tie: 0,
                    };
                    UpdateScoreElement();

                    /*
                    if (!score) {
                        score = {
                            Win: 0,
                            Lose: 0,
                            Tie: 0,
                        };
                    }   
                    */
                    function playGame(playerMove) {
                        const ComputerMove = PickComputerMove();

                        let result = '';

                        if (ComputerMove === playerMove) {
                            result = 'Tie.';
                        } else if (
                            (ComputerMove === 'Rock' && playerMove === 'Paper') ||
                            (ComputerMove === 'Paper' && playerMove === 'Scissors') ||
                            (ComputerMove === 'Scissors' && playerMove === 'Rock')
                        ) {
                            result = 'You win!';        
                        } else {
                            result = 'You lose!';
                        }
                    
                
                        if (result === 'You win!') {
                            score.Win += 1;
                        } else if (result === 'You lose!') {
                            score.Lose += 1;
                        } else {
                            score.Tie += 1;
                        }
                    
                        localStorage.setItem("score", JSON.stringify(score));
                        UpdateScoreElement();

                        document.querySelector('.js-moves') .innerHTML =
                        `You
                            <img src="image/${PlayerMove}-emoji.png" class="move-icon">
                            <img src="image/${ComputerMove}-emoji.png" class="move-icon">
                            Computer.`;
                        document.querySelector('.js-result') .innerHTML =
                        result;

                    }

                    function UpdateScoreElement() {
                        document.querySelector('.js-score') .innerHTML =
                        `Score - Win: ${score.Win}, Lose: ${score.Lose}, Tie: ${score.Tie}`;
                    }
                    function PickComputerMove() {
                        const randomNumber = Math.random();

                        let ComputerMove = '';

                        if (randomNumber >= 0 && randomNumber < 1/3) {
                            ComputerMove = 'Rock';
                        } else if (randomNumber >= 1/3 && randomNumber < 2/3) {
                            ComputerMove = 'Paper';
                        } else{
                            ComputerMove = 'Scissors';
                        }

                        console.log(`Computer Move: ${ComputerMove}`);
                        return ComputerMove;
                    }

                </script>
                </body>
                </html>
