<!DOCTYPE html>
<html>
  <head>
    <title>chat bot</title>
    <style>
      .js-container {
       
      }
      .js-send-button {
        background-color: green;
        color: white;
        border: none;
        padding: 12px 20px;
        font-size: 15px;
        border-radius: 10px;
        margin-left: 10px;
        cursor: pointer;
      }
      .chat-input {
        margin-bottom: 20px;
        padding: 12px 15px;
        font-size: 15px;
        border: 1px solid #ccc;
        border-radius: 12px;
        width: 300px;
        flex-grow: 1;
      }
      .chat-input-container {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
      }
      .chat-container {
        border: 2px solid #ccc;
        border-radius: 12px;
        padding: 20px;
        width: 400px;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/external-library.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({ chatMessages, setChatMessages }) {
        const  [ inputText, setInputText ] = React.useState ('');
        function saveInputText(event) {
          setInputText(event.target.value);
        };

        function sendMessage() {
          const newChatMessages = [
            ...newChatMessages,
            {
              message: inputText,
              sender: "User",
              id: crypto.randomUUID()
            }
          ];
          setChatMessages(newChatMessages);
          const response = Chatbot.getResponse(inputText);
          setChatMessages([
            ...newChatMessages,
            {
              message: response,
              sender: "robot",
              id: crypto.randomUUID()
            }
          ]);
          console.log('Response from chatbot:', response);

          setInputText('');
        } 
        return (
          <div className="chat-input-container">
            <input 
              placeholder="Type your message..." 
              size="30"
              onChange={saveInputText}
              value={inputText}
              className="chat-input"
            />
            <button className="js-send-button" 
            onClick={sendMessage}>Send</button>
          </div>
        );
      }
      function ChatMessage ({ message, sender }) {
        return (
          <div>
            {sender === 'robot' && (<img src="robot.png" width="50" />)}
            {message}{sender === 'User' && (<img src="user.png" width="50" />)}
          </div>
        );
      };
      function ChatMessages() {
      const [chatMessages, setChatMessages] = React.useState([ { 
          message: "Hello Chatbot", 
          sender: "User",
          id: 'id1' 
        },  { 
          message: "Hello! How can I help you?", 
          sender: "robot",
          id: 'id2'
        },  { 
          message: "can you get me today date?", 
          sender: "User",
          id: 'id3' 
        },  { 
          message: "Today is June 7, 2024.", 
          sender: "robot",
          id: 'id4' 
        }]);
        return (
          <div >
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage 
                  message={chatMessage.message} 
                  sender={chatMessage.sender} 
                  key={chatMessage.id}
                />
              );
            })}
          </div>
        );
      };


      function App() {
         const [chatMessages, setChatMessages] = React.useState ([{ 
          message: "Hello Chatbot", 
          sender: "User",
          id: 'id1' 
        },  { 
          message: "Hello! How can I help you?", 
          sender: "robot",
          id: 'id2'
        },  { 
          message: "can you get me today date?", 
          sender: "User",
          id: 'id3' 
        },  { 
          message: "Today is June 7, 2024.", 
          sender: "robot",
          id: 'id4' 
        }]);

        return (
          <div className="chat-container">
            <ChatInput 
            chatMessages={chatMessages}
            setChatMessages={setChatMessages}
            />
            <ChatMessages
              chatMessages={chatMessages}
            />
          </div>
        );
      };
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
