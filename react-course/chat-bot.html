<!DOCTYPE html>
<html>
  <head>
    <title>chat bot</title>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev@8.6.4/external-libaray.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput() {
        return (
          <>
            <h2>Chat Bot</h2>
            <input type="text" placeholder="Type your message..." size="30" 
            />
            <button>Send</button>
          </>
        );
      }
      function ChatMessage ({ message, sender }) {
      /*
        if (sender === 'robot') {
          return (
            <div>
              <img src="robot.png" width="30" />
              {message}
            </div>
          );
        }
      */
        return (
          <>
            {sender === 'robot' && 
            (<img src="robot.png" width="30" />)}
            {message}
            {sender === 'User' && (
            <img src="user.png" width="30" />
            )}
          </>
        );
      }
      function ChatMessages() {
        const chatMessages = [{ 
            message: "Hello Chatbot", 
            sender: "User",
            id: 'id1' 
        },{ 
            message: "Hello! How can I help you?", 
            sender: "robot",
            id: 'id2'
        },{ 
            message: "can you get me today date?", 
            sender: "User",
            id: 'id3' 
        },{ 
            message: "Today is June 7, 2024.", 
            sender: "robot",
            id: 'id4' 
        }];
        function SendMessage() {
          alert('Send Message');
        }
        console.log('chatMessages:', chatMessages);
        return (
          <>
            <button onClick={() => alert('Send Message')}>Send Message</button>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage 
                  message={chatMessage.message} 
                  sender={chatMessage.sender} 
                  key={chatMessage.id}
                />
              );
            })}
          </>
        );
      }
      function App() {
        return (
          <>
            <ChatInput />
            <ChatMessages />
          </>
        );
      }      
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
